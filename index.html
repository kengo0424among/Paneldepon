<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>PanePon</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div id="replay-controls">
    <button id="replay-record">記録開始</button>
    <button id="replay-stop">記録停止</button>
    <button id="replay-play">再生</button>
    <button id="replay-save">保存</button>
    <button id="replay-load">読み込み</button>
    <input type="file" id="replay-file" style="display:none" accept=".json">
  </div>
  <div id="game" style="visibility:hidden;font-style:italic">
        <!--A:Swap Panels/S:SPEEEED!/Arrows:Move Cursor-->
    </div>
    <div id="startMenu">
    </div>
    <svg width="1" height="1" style="visibility:hidden" id="star">
        <polygon points="0.5,0 0.6,0.4 1,0.5 0.6,0.6 0.5,1 0.4,0.6 0,0.5 0.4,0.4" stroke="#f80" fill="#ff0"></polygon>
    </svg>
    <script  src="./script.js"></script>

  </body>
  
</html>
